<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Theater</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <!-- Search bar container -->
     <div class="searchBarContainer">
        <label for="searchBarInput" class="searchPrompt">Search for GIFS...</label>
        <input type="search" id="searchBarInput" placeholder="Search for GIFS...!!" value="hamster">
        <button id="searchBtn">Search</button>
     </div>
     <!-- Image container-->
     <div class="imgContainer">
        <img class="img" src="" alt="This be a Gif from Giphy">
     </div>
     <!-- Button Container -->
     <div class="nextBtnContainer">
        <button class="nextBtn">Next GIF</button>
     </div>
</body>
</html>
